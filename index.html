<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webhook Chat Widget</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    #chatbox {
      border: 1px solid #ccc;
      width: 400px;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      background: #f9f9f9;
    }
    .message {
      margin: 5px 0;
      padding: 8px;
      border-radius: 5px;
    }
    .sent {
      background: #d1e7dd;
      text-align: right;
    }
    .received {
      background: #e2e3f3;
      text-align: left;
    }
    .error {
      background: #f8d7da;
      text-align: left;
    }
    .info {
      color: #555;
      font-style: italic;
      text-align: center;
    }
    #controls {
      display: flex;
      gap: 5px;
    }
    #controls input {
      flex: 1;
      padding: 5px;
    }
    #controls button {
      padding: 5px 10px;
    }
  </style>
</head>
<body>
  <h2>Webhook Chat Widget (Day 1)</h2>
  <div id="chatbox"></div>

  <form id="controls">
    <input id="event" placeholder="Event name" aria-label="Event name" required />
    <input id="message" placeholder="Message" aria-label="Message" />
    <button type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById("controls");
    const eventInput = document.getElementById("event");
    const messageInput = document.getElementById("message");

    // On GitHub Pages there is no server, so send events to the copy of this
    // app running on Render. Locally (or on Render itself) use this server.
    const API_BASE = location.hostname.endsWith("github.io")
      ? "https://northstar-day1-webhook.onrender.com"
      : "";

    async function sendWebhook(event, message) {
      addMessage(`You: ${event} - ${message}`, "sent");

      // Render's free plan sleeps when idle; the first request can take up to a minute.
      const wakeHint = setTimeout(
        () => addMessage("Waking up the free server, this can take up to a minute...", "info"),
        4000,
      );

      try {
        const res = await fetch(`${API_BASE}/webhook`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ event, message }),
        });

        if (!res.ok) {
          addMessage(`Server rejected the event (status ${res.status}).`, "error");
          return;
        }

        const data = await res.json();
        addMessage("Server: " + JSON.stringify(data.received), "received");
      } catch {
        addMessage("Could not reach the server. Please try again in a moment.", "error");
      } finally {
        clearTimeout(wakeHint);
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const event = eventInput.value.trim();
      if (!event) return;
      sendWebhook(event, messageInput.value.trim());
      messageInput.value = "";
    });

    function addMessage(text, type) {
      const chatbox = document.getElementById("chatbox");
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight; // auto-scroll
    }
  </script>
</body>
</html>
