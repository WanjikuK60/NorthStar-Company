<!DOCTYPE html>
<html>
<head>
  <title>Day 3 Chat Widget</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    #chatbox {
      border: 1px solid #ccc;
      width: 400px;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      background: #f9f9f9;
    }
    .message { margin: 5px 0; padding: 8px; border-radius: 5px; }
    .sent { background: #d1e7dd; text-align: right; }
    .received { background: #f8d7da; text-align: left; }
    #controls { display: flex; gap: 5px; margin-bottom: 10px; }
    #controls input { flex: 1; padding: 5px; }
    #controls button { padding: 5px 10px; }
  </style>
</head>
<body>
  <h2>Day 3 Chat Widget</h2>
  <div id="chatbox"></div>

  <!-- Webhook controls -->
  <div id="controls">
    <input id="event" placeholder="Event name" />
    <input id="message" placeholder="Message" />
    <button onclick="sendWebhook()">Send</button>
  </div>

  <!-- Stock query button -->
  <button onclick="getStock()">Check Warehouse Stock</button>

  <script>
    async function sendWebhook() {
      const event = document.getElementById("event").value;
      const message = document.getElementById("message").value;

      addMessage(`You: ${event} - ${message}`, "sent");

      try {
        const res = await fetch("http://127.0.0.1:8000/webhook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ event, message })
        });

        const data = await res.json();
        addMessage("Server: " + JSON.stringify(data.received), "received");
      } catch (err) {
        addMessage("Error: Could not reach backend", "received");
      }
    }

    async function getStock() {
      addMessage("You: Requesting warehouse stock...", "sent");

      try {
        const res = await fetch("http://127.0.0.1:8000/stock");
        const data = await res.json();

        if (data.cached_stock === "No data yet") {
          addMessage("Server (cached stock): No data yet — polling in progress...", "received");
        } else if (data.cached_stock.title) {
          addMessage(
            `Server (cached stock): Title = "${data.cached_stock.title}", Completed = ${data.cached_stock.completed}`,
            "received"
          );
        } else {
          addMessage("Server (cached stock): " + JSON.stringify(data.cached_stock), "received");
        }
      } catch (err) {
        addMessage("Error: Could not reach backend", "received");
      }
    }

    function addMessage(text, type) {
      const chatbox = document.getElementById("chatbox");
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
</body>
</html>
