<!DOCTYPE html>
<html>
<head>
  <title>Webhook Chat Widget</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    #chatbox {
      border: 1px solid #ccc;
      width: 400px;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      background: #f9f9f9;
    }
    .message {
      margin: 5px 0;
      padding: 8px;
      border-radius: 5px;
    }
    .sent {
      background: #d1e7dd;
      text-align: right;
    }
    .received {
      background: #f8d7da;
      text-align: left;
    }
    #controls {
      display: flex;
      gap: 5px;
    }
    #controls input {
      flex: 1;
      padding: 5px;
    }
    #controls button {
      padding: 5px 10px;
    }
  </style>
</head>
<body>
  <h2>Webhook Chat Widget (Day 1)</h2>
  <div id="chatbox"></div>

  <div id="controls">
    <input id="event" placeholder="Event name" />
    <input id="message" placeholder="Message" />
    <button onclick="sendWebhook()">Send</button>
  </div>

  <script>
    async function sendWebhook() {
      const event = document.getElementById("event").value;
      const message = document.getElementById("message").value;

      // Show what you sent
      addMessage(`You: ${event} - ${message}`, "sent");

      const res = await fetch("http://127.0.0.1:8000/webhook", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ event, message })
      });

      const data = await res.json();

      // Show backend reply
      addMessage("Server: " + JSON.stringify(data.received), "received");
    }

    function addMessage(text, type) {
      const chatbox = document.getElementById("chatbox");
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight; // auto-scroll
    }
  </script>
</body>
</html>
